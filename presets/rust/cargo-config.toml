[alias]
lint = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--",
  "-Dclippy::disallowed_methods",
  "-Dclippy::disallowed_types",
  "-Dclippy::let_underscore_must_use",
  "-Dclippy::let_underscore_lock",
  "-Dclippy::map_err_ignore",
  "-Dclippy::manual_unwrap_or_default",
  "-Dclippy::await_holding_lock",
  "-Dclippy::await_holding_refcell_ref",
  "-Dclippy::cognitive_complexity",
  "-Dclippy::excessive_nesting",
  "-Dclippy::too_many_arguments",
  "-Ddead_code",
  "-Dunused_imports",
  "-Dunused_variables",
  "-Dunused_must_use",
]
