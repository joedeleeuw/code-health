target-version = "py312"
extend-exclude = [
    "code_health/rule-tests/*",
]

[lint]
select = ["E4", "E7", "E9", "F", "BLE001", "S110", "S112", "PLW1510",
    "B904", "B905", "SIM116", "SLF001", "TID251", "RUF006", "TRY004", "DTZ"]

[lint.flake8-tidy-imports.banned-api]
"contextlib.suppress".msg = "G7: fail loudly; do not suppress exceptions"
"unittest.mock".msg = "G15/W1: no fakes or mocks; test the real runtime"
"mock".msg = "G15/W1: no fakes or mocks; test the real runtime"
"pytest_mock".msg = "G15/W1: no fakes or mocks; test the real runtime"
"warnings.deprecated".msg = "G5: no deprecation paths; delete legacy code"
"typing_extensions.deprecated".msg = "G5: no deprecation paths; delete legacy code"
