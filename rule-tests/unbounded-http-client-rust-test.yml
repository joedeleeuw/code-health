id: unbounded-http-client-rust
language: Rust
valid:
  - |
    use reqwest::Client;
    use std::time::Duration;
    fn build_http() -> reqwest::Result<Client> {
        Client::builder().timeout(Duration::from_secs(10)).build()
    }
  - |
    fn client() {
        let client = reqwest::blocking::Client::new();
    }
  - |
    fn fetch(url: &str) {
        ureq::get(url)
            .config()
            .timeout_global(Some(std::time::Duration::from_secs(5)))
            .build()
            .call();
    }
  - |
    use std::time::Duration;
    fn fetch_v2(url: &str) -> Result<ureq::Response, ureq::Error> {
        ureq::get(url).timeout(Duration::from_secs(5)).call()
    }
  - |
    fn prepare_request(url: &str) -> ureq::Request {
        ureq::get(url)
    }
  - |
    mod http_layer {
        use reqwest::Client;
    }
    mod db_layer {
        struct Client;
        impl Client {
            fn new() -> Self { Self }
        }
        fn local_client() -> Client {
            Client::new()
        }
    }
  - |
    #[cfg(test)]
    mod tests {
        #[tokio::test]
        async fn smoke() {
            let _ = reqwest::get("http://localhost:8080").await;
        }
    }
invalid:
  - |
    async fn fetch_status(url: &str) -> reqwest::Result<reqwest::Response> {
        reqwest::get(url).await
    }
  - |
    use reqwest::Client;
    fn make_client() -> Client {
        Client::new()
    }
  - |
    fn blocking_fetch(url: &str) -> Result<ureq::Response, ureq::Error> {
        ureq::get(url).call()
    }
