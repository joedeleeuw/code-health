id: error-string-branch-rust
language: Rust
valid:
  - |
    fn match_typed_variant(res: Result<(), ApiError>) -> bool {
        matches!(res, Err(ApiError::Unauthorized))
    }
  - |
    fn retry(outcome: Result<(), std::io::Error>, name: &str) -> bool {
        match outcome {
            Err(_) if name.starts_with("temp") => true,
            _ => false,
        }
    }
  - |
    fn non_branching_body_calc(flag: bool, err: std::io::Error) -> bool {
        if flag {
            let matched = err.to_string().contains("temp");
            return matched;
        }
        false
    }
  - |
    fn check_normal_string(line: &str) -> bool {
        if line.contains("error") {
            return true;
        }
        false
    }
invalid:
  - |
    fn branch_on_to_string(res: Result<(), ApiError>) -> bool {
        match res {
            Ok(()) => false,
            Err(err) => {
                if err.to_string().contains("401") {
                    true
                } else {
                    false
                }
            }
        }
    }
  - |
    fn match_guard_on_msg(res: Result<(), String>) -> bool {
        match res {
            Err(e) if e.contains("timeout") => true,
            _ => false,
        }
    }
  - |
    fn if_let_err_branch(res: Result<(), String>) {
        if let Err(err) = res {
            if err.starts_with("ENOENT") {
                recover();
            }
        }
    }
