id: revalidation-isinstance-typed-param
language: Python
valid:
  - |
    @mcp_tool
    def normalize(raw: str):
        if isinstance(raw, bytes):
            return raw.decode()
        return raw
  - |
    def normalize(raw: object):
        if isinstance(raw, str):
            return raw.strip()
        return str(raw)
  - |
    def normalize(raw: str | bytes):
        if isinstance(raw, bytes):
            return raw.decode()
        return raw
  - |
    def normalize(raw: str = None):
        if isinstance(raw, str):
            return raw.strip()
invalid:
  - |
    def normalize(raw: str):
        if not isinstance(raw, str):
            raise TypeError("raw must be str")
        return raw
  - |
    def validate(spec: TaskSpec):
        if not isinstance(spec, TaskSpec):
            raise TypeError("invalid spec")
