id: untyped-value-probe-rust
language: Rust
valid:
  - |
    #[derive(serde::Deserialize)]
    struct WireEnvelope {
        pub kind: String,
        #[serde(flatten)]
        pub extra: std::collections::BTreeMap<String, serde_json::Value>,
    }
  - |
    impl ExternalTrait for Adapter {
        fn call(&self, args: std::collections::HashMap<String, serde_json::Value>) {}
    }
  - |
    fn get(
        matrix: std::collections::HashMap<
            String, std::collections::HashMap<String, i32>
        >
    ) -> i32 {
        matrix["a"]["b"]
    }
  - |
    fn lookup_user(users: &std::collections::HashMap<String, User>) -> Option<&User> {
        if let Some(u) = users.get("admin") {
            return Some(u);
        }
        None
    }
  - |
    fn edit_toml_cst(doc: &toml_edit::DocumentMut) -> Option<&str> {
        let _ = doc.get("project").and_then(Item::as_table);
        doc.get("project")?.as_str()
    }
  - |
    struct Value;
    struct LocalMap {
        entries: std::collections::HashMap<String, Value>,
    }
invalid:
  - |
    fn probe_closure(val: &serde_json::Value) -> Option<&str> {
        val.get("name").and_then(|v| v.as_str())
    }
  - |
    fn probe_toml(val: &toml::Value) -> Option<i64> {
        val.get("port").and_then(toml::Value::as_integer)
    }
  - |
    fn probe_pointer(val: &serde_json::Value) -> Option<&serde_json::Value> {
        val.pointer("/choices/0/text")
    }
  - |
    fn probe_indexed_coercion(val: &serde_json::Value) -> Option<&str> {
        val["user"]["email"].as_str()
    }
  - |
    struct Bag {
        meta: serde_json::Map<String, serde_json::Value>,
    }
  - |
    struct OptionalBag {
        attrs: Option<std::collections::HashMap<String, serde_json::Value>>,
    }
  - |
    fn payload() -> serde_json::Map<String, serde_json::Value> {
        serde_json::Map::new()
    }
