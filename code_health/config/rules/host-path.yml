id: host-path-yaml
language: Yaml
severity: warning
message: Host-absolute path in a repository file (tracked or untracked; only ignored files are skipped). Use HOME-relative or config-driven paths.
ignores:
  - "**/fixtures/**"
  - "**/__fixtures__/**"
metadata:
  directive: S4
  source: "cloud-rl-train AGENTS.md#process"
rule:
  any:
    - kind: plain_scalar
      regex: "^/(Users|home)/[^/]+/"
    - kind: double_quote_scalar
      regex: '^"/(Users|home)/[^/]+/'
    - kind: single_quote_scalar
      regex: "^'/(Users|home)/[^/]+/"
---
id: host-path-markdown
language: Markdown
severity: warning
message: Host-absolute path in a repository file (tracked or untracked; only ignored files are skipped). Use repo-relative links or HOME-relative paths.
ignores:
  - "**/fixtures/**"
  - "**/__fixtures__/**"
metadata:
  directive: S4
  source: "cloud-rl-train AGENTS.md#process"
rule:
  any:
    - kind: inline
      regex: "(?:^|[^A-Za-z0-9_.~/-]|[A-Za-z][A-Za-z0-9+.-]*://[^/\\s]*)/(Users|home)/[^/]+/"
    - kind: link_destination
      regex: "^(?:[A-Za-z][A-Za-z0-9+.-]*://[^/\\s]*)?/(Users|home)/[^/]+/"
---
id: host-path-rust
language: Rust
severity: warning
message: Host-absolute path in a repository file (tracked or untracked; only ignored files are skipped). Use HOME-relative or config-driven paths.
ignores:
  - "**/fixtures/**"
  - "**/__fixtures__/**"
  - "**/target/**"
  - "**/vendor/**"
  - "**/third_party/**"
  - "**/tests/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
  - "**/*_test.rs"
metadata:
  directive: S4
  source: "cloud-rl-train AGENTS.md#process"
rule:
  all:
    - any:
        - kind: string_literal
        - kind: raw_string_literal
    - not:
        inside: {matches: test-scope, stopBy: end}
    - has:
        kind: string_content
        all:
          - regex: "^/(Users|home)/[^/]+/"
          - not: {regex: "^/(Users|home)/(linuxbrew|node|runner|\\[\\^)/"}
