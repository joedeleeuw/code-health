id: secret-call-bash
language: Bash
severity: warning
message: Direct secret-store call. Resolve secrets through secret-resolve or secret-get, never secret-tool/op/security directly.
ignores:
  - "scripts/secret-resolve"
  - "scripts/secret-provision"
  - "scripts/secret-get"
metadata:
  directive: G18
  source: "ai-contexts/AGENT.md#workflow-and-conventions"
rule:
  kind: command
  regex: "^(secret-tool|op (read|item get)|security find-generic-password[\\s\\S]*\\s-(w|g)\\b)"
---
id: secret-call-python
language: Python
severity: warning
message: Direct secret-store call. Resolve secrets through secret-resolve or secret-get, never secret-tool/op/security directly.
ignores:
  - "scripts/secret-resolve"
  - "scripts/secret-provision"
  - "scripts/secret-get"
metadata:
  directive: G18
  source: "ai-contexts/AGENT.md#workflow-and-conventions"
rule:
  any:
    - kind: call
      regex: "(secret-tool|op (read|item get)|security find-generic-password)"
    - kind: list
      regex: "['\"]op['\"],\\s*['\"](read|item)"
