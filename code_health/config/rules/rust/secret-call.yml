id: secret-call-rust
language: Rust
severity: warning
message: Direct secret-store call. Resolve secrets through secret-resolve or secret-get, never secret-tool/op/security directly.
ignores:
  - "**/vendor/**"
  - "**/third_party/**"
metadata:
  directive: G18
  source: "ai-contexts/AGENT.md#workflow-and-conventions"
rule:
  kind: call_expression
  regex: "(secret-tool|\"op\"[\\s\\S]*\"(read|item)\"|find-generic-password)"
