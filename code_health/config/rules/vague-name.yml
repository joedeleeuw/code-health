id: vague-name-python
language: Python
severity: warning
message: Vague declared name. Names say what the value is; filler nouns, suffixes and prefixes carry nothing.
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
metadata:
  directive: G21
  source: "ai-contexts/AGENT.md#code"
rule:
  all:
    - any:
        # exact vague nouns, case-insensitive whole name, optional trailing digit
        # (wemake-python-styleguide WPS110, pylint bad-names, brief list)
        - regex: "(?i)^(?:data|info|value|values|val|vals|obj|objects|objs|thing|things|stuff|temp|tmp|foo|bar|baz|res|ret|retval|misc|result|results|item|items|var|vars|variable|param|params|parameters|arr|spam|ham|toto|tutu|tata)\\d*$"
        # filler suffixes on another word, camelCase
        - regex: "\\w+(?:Value|Data|Info|Obj|Object|Thing|Stuff)$"
        # filler suffixes on another word, snake_case
        - regex: "\\w+_(?:value|data|info|obj|object|thing|stuff)$"
        # filler prefixes: myConfig, the_list, someFlag, tempFile, tmp_path
        - regex: "^(?:my|the|some|temp|tmp)[A-Z_]\\w*"
        # abbreviations (eslint-plugin-unicorn prevent-abbreviations)
        - regex: "^(?:cb|ctx|el|err|evt|fn|msg|opts|req|str)\\d*$"
        # single-letter names except i, j, k, n, x, y, _
        - regex: "^[a-hl-mo-wzA-HL-MO-WZ]$"
    - any:
        - inside: {kind: function_definition, field: name}
        - inside: {kind: class_definition, field: name}
        - inside: {kind: assignment, field: left}
        - inside: {kind: parameters}
        - inside: {kind: default_parameter, field: name}
        - inside: {kind: typed_parameter}
        - inside: {kind: typed_default_parameter, field: name}
    # a temp prefix on a location says what it is: tmp_path, tempDir, temp_file
    - not:
        regex: "(?i)^te?mp_?(?:dir|directory|file|path|root|base|home)s?$"
    - kind: identifier
---
id: vague-name-rust
language: Rust
severity: warning
message: Vague declared name. Names say what the value is; filler nouns, suffixes and prefixes carry nothing.
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/target/**"
  - "**/vendor/**"
  - "**/third_party/**"
  - "**/tests/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
  - "**/*_test.rs"
metadata:
  directive: G21
  source: "ai-contexts/AGENT.md#code"
utils:
  non-attr-sibling:
    regex: "."
    not:
      any:
        - kind: attribute_item
        - kind: line_comment
        - kind: block_comment
  serde-container:
    any:
      - kind: struct_item
      - kind: enum_item
    follows:
      kind: attribute_item
      regex: '\b(Deserialize|Serialize)\b'
      stopBy:
        matches: non-attr-sibling
  trait-impl:
    kind: impl_item
    has: {field: trait, regex: "."}
  conversion-fn:
    kind: function_item
    has:
      field: name
      regex: "^(from_|try_from|parse|format_|new$|with_|default_)"
  temp-initializer:
    kind: let_declaration
    has:
      field: value
      regex: '(?i)(temp_?dir|NamedTempFile|TempDir|temp)'
rule:
  all:
    - any:
        - regex: "(?i)^(?:data|info|value|values|val|vals|obj|objects|objs|thing|things|stuff|temp|tmp|foo|bar|baz|res|ret|retval|misc|result|results|item|items|var|vars|variable|param|params|parameters|arr|spam|ham|toto|tutu|tata)\\d*$"
        - regex: "\\w+(?:Value|Data|Info|Obj|Object|Thing|Stuff)$"
        - regex: "\\w+_(?:value|data|info|obj|object|thing|stuff)$"
        - regex: "^(?:my|the|some|temp|tmp)[A-Z_]\\w*"
        - regex: "^(?:cb|ctx|el|err|evt|fn|msg|opts|req|str)\\d*$"
    - not:
        inside: {matches: test-scope, stopBy: end}
    - any:
        - kind: identifier
          any:
            - inside: {kind: function_item, field: name}
            - inside:
                kind: let_declaration
                field: pattern
                not:
                  any:
                    - matches: temp-initializer
                    - has: {kind: struct_pattern, stopBy: end}
                    - has: {kind: tuple_struct_pattern, stopBy: end}
            - inside:
                kind: parameter
                field: pattern
                not:
                  any:
                    - inside: {matches: trait-impl, stopBy: end}
                    - inside: {matches: conversion-fn, stopBy: end}
        - kind: type_identifier
          any:
            - inside: {kind: struct_item, field: name}
            - inside: {kind: enum_item, field: name}
            - inside: {kind: trait_item, field: name}
            - inside: {kind: type_item, field: name}
        - kind: field_identifier
          inside:
            kind: field_declaration
            field: name
            not:
              inside: {matches: serde-container, stopBy: end}
    - not:
        regex: "(?i)^(?:te?mp_?(?:dir|directory|file|path|root|base|home|celsius|kelvin|fahrenheit|c|f|k|mc|millicelsius|sensor|input|limit|threshold|max|min|label|reading|value|history|chart|color|icon)s?|formData|imageData)$"
