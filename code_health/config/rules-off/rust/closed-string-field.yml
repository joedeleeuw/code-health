id: closed-string-field-rust
language: Rust
severity: error
message: A status, kind, state, level, mode, role or severity field is a String, so any text is a valid case. Declare the cases in a Rust enum (#[derive(Serialize, Deserialize)]) so the compiler enforces exhaustiveness.
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/target/**"
  - "**/vendor/**"
  - "**/third_party/**"
  - "**/tests/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
  - "**/*_test.rs"
  - "**/benches/**"
  - "**/examples/**"
metadata:
  directive: G9
rule:
  kind: field_declaration
  all:
    - has:
        field: name
        regex: "^(status|kind|state|level|mode|role|type_|severity)$"
    - has:
        field: type
        regex: "^(String|Option<String>)$"
    - not:
        all:
          - has:
              field: name
              regex: "^state$"
          - inside:
              kind: field_declaration_list
              has:
                kind: field_declaration
                has:
                  field: name
                  regex: "^code$"
    - not:
        inside: {matches: test-scope, stopBy: end}
