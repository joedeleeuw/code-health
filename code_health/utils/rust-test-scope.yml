id: test-scope
language: Rust
rule:
  any:
    - kind: mod_item
    - kind: function_item
    - kind: impl_item
    - kind: expression_statement
    - kind: let_declaration
  follows:
    kind: attribute_item
    regex: "(?:cfg\\s*\\(\\s*test\\s*\\)|cfg\\s*\\(\\s*all\\s*\\((?:[^)]*,)?\\s*test\\s*[,)]|^#\\[\\s*(?:[a-z0-9_]+::)*test\\b)"
    stopBy:
      not:
        any:
          - kind: attribute_item
          - kind: line_comment
          - kind: block_comment
