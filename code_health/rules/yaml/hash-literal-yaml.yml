id: hash-literal-yaml
language: Yaml
severity: off
message: Hash pin of a repo-tracked file (64-hex literal). Third-party artifact pins belong in lockfiles; repo content does not get pinned.
ignores:
  - "**/*.lock"
  - "**/package-lock.json"
  - "**/pnpm-lock.yaml"
  - "**/uv.lock"
  - ".github/workflows/**"
  - "**/fixtures/**"
  - "**/__fixtures__/**"
  - "**/testdata/**"
metadata:
  directive: S1
rule:
  any:
    - kind: plain_scalar
      regex: "^[0-9a-fA-F]{64}$"
    - kind: double_quote_scalar
      regex: '^"[0-9a-fA-F]{64}"$'
    - kind: single_quote_scalar
      regex: "^'[0-9a-fA-F]{64}'$"
