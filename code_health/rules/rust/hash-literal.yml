id: hash-literal-rust
language: Rust
severity: off
message: Hash pin of a repo-tracked file (64-hex literal). Third-party artifact pins belong in lockfiles; repo content does not get pinned.
ignores:
  - "**/*.lock"
  - "**/fixtures/**"
  - "**/__fixtures__/**"
  - "**/testdata/**"
  - "**/target/**"
  - "**/vendor/**"
  - "**/third_party/**"
metadata:
  directive: S1
rule:
  kind: string_content
  regex: "^[0-9a-fA-F]{64}$"
