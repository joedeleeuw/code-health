id: anemic-error-rust
language: Rust
severity: error
message: Function returns Result<T, String> or erases error types via .map_err(|e| e.to_string()); use a typed domain error enum or error crate type.
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/target/**"
  - "**/vendor/**"
  - "**/third_party/**"
  - "**/tests/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
  - "**/*_test.rs"
metadata:
  directive: G7
rule:
  all:
    - not:
        inside:
          matches: test-scope
          stopBy: end
    - any:
        - pattern: $EXPR.map_err(|$E| $E.to_string())
        - pattern: $EXPR.map_err(|$E| format!("{}", $E))
        - all:
            - pattern: $EXPR.map_err(|$E| format!($$$))
            - has:
                kind: string_literal
                regex: "^\"\\{[A-Za-z_]\\w*\\}\"$"
                stopBy: end
        - all:
            - pattern: $EXPR.map_err(|$E| { $$$ })
            - any:
                - has:
                    all:
                      - pattern: $E.to_string()
                      - inside: {kind: block, stopBy: neighbor}
                    stopBy: end
                - has:
                    all:
                      - pattern: format!("{}", $E)
                      - inside: {kind: block, stopBy: neighbor}
                    stopBy: end
                - has:
                    all:
                      - kind: macro_invocation
                        regex: "^format!"
                      - has:
                          kind: string_literal
                          regex: "^\"\\{[A-Za-z_]\\w*\\}\"$"
                          stopBy: end
                      - inside: {kind: block, stopBy: neighbor}
                    stopBy: end
        - kind: generic_type
          all:
            - has:
                field: type
                any:
                  - kind: type_identifier
                    regex: "^Result$"
                  - kind: scoped_type_identifier
                    regex: "^(std|core)::result::Result$"
            - has:
                field: type_arguments
                kind: type_arguments
                regex: ",\\s*String\\s*>$"
            - inside:
                kind: function_item
                field: return_type
                stopBy: {kind: function_item}
