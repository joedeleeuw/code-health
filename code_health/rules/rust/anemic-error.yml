id: anemic-error-rust
language: Rust
severity: error
message: Signature or alias uses Result<T, String>, or .map_err erases a typed error into String; use a typed domain error enum or error crate type.
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/target/**"
  - "**/vendor/**"
  - "**/third_party/**"
  - "**/tests/**"
  - "**/examples/**"
  - "**/benches/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
  - "**/*_test.rs"
metadata:
  directive: G7
rule:
  all:
    - not:
        inside:
          matches: test-scope
          stopBy: end
    - any:
        - pattern: $EXPR.map_err(|$E| $E.to_string())
        - pattern: $EXPR.map_err(|$E| $E.to_owned())
        - pattern: $EXPR.map_err(|$E| String::from($E))
        - pattern: $EXPR.map_err(ToString::to_string)
        - pattern: $EXPR.map_err(String::from)
        - kind: call_expression
          all:
            - has:
                field: function
                kind: field_expression
                has:
                  field: field
                  regex: "^map_err$"
            - has:
                field: arguments
                has:
                  kind: closure_expression
                  any:
                    - has:
                        field: body
                        any:
                          - kind: macro_invocation
                            has:
                              field: macro
                              regex: "^(std::)?format$"
                          - kind: block
                            has:
                              kind: macro_invocation
                              has:
                                field: macro
                                regex: "^(std::)?format$"
                              stopBy: neighbor
                    - all:
                        - has:
                            field: parameters
                            has:
                              kind: identifier
                              pattern: $E
                        - has:
                            field: body
                            kind: block
                            has:
                              any:
                                - pattern: $E.to_string()
                                - pattern: $E.to_owned()
                                - pattern: String::from($E)
                              stopBy: neighbor
        - kind: generic_type
          all:
            - has:
                field: type
                any:
                  - kind: type_identifier
                    regex: "^Result$"
                  - kind: scoped_type_identifier
                    regex: "^(std|core)::result::Result$"
            - has:
                field: type_arguments
                kind: type_arguments
                regex: ",\\s*(std::string::)?String\\s*>$"
            - any:
                - inside:
                    all:
                      - kind: function_item
                      - not:
                          matches: trait-impl-fn
                    field: return_type
                    stopBy:
                      any:
                        - kind: function_item
                        - kind: block
                - inside:
                    kind: function_signature_item
                    field: return_type
                    stopBy:
                      kind: function_signature_item
                - inside:
                    all:
                      - kind: type_item
                      - not:
                          inside:
                            kind: impl_item
                            has:
                              field: trait
                              regex: "."
                            stopBy:
                              kind: type_item
                    field: type
                    stopBy:
                      kind: type_item
