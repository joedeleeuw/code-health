id: untyped-value-boundary-rust
language: Rust
severity: error
message: "Raw serde_json::Value in a function parameter, return type, or struct field defers schema validation into callers and callees; use a closed #[derive(Serialize, Deserialize)] struct or enum."
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/target/**"
  - "**/vendor/**"
  - "**/third_party/**"
  - "**/tests/**"
  - "**/examples/**"
  - "**/benches/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
  - "**/*_test.rs"
metadata:
  directive: G4
utils:
  local-value-type-def:
    any:
      - kind: struct_item
        has: {field: name, regex: "^Value$"}
      - kind: enum_item
        has: {field: name, regex: "^Value$"}
      - kind: type_item
        has: {field: name, regex: "^Value$"}
      - kind: union_item
        has: {field: name, regex: "^Value$"}
  json-value-use-decl:
    kind: use_declaration
    all:
      - regex: "serde_json::(value::)?(Value\\b|\\*|\\{[^}]*\\bValue\\b)"
      - not:
          regex: "\\bValue\\s+as\\s+\\w+"
  in-json-value-scope:
    any:
      - inside:
          kind: block
          all:
            - has:
                matches: json-value-use-decl
                stopBy: neighbor
            - not:
                has:
                  matches: local-value-type-def
                  stopBy: neighbor
          stopBy:
            kind: mod_item
      - all:
          - not:
              inside:
                kind: block
                has:
                  matches: local-value-type-def
                  stopBy: neighbor
                stopBy:
                  kind: mod_item
          - any:
              - inside:
                  kind: declaration_list
                  all:
                    - inside:
                        kind: mod_item
                        stopBy: neighbor
                    - has:
                        matches: json-value-use-decl
                        stopBy: neighbor
                    - not:
                        has:
                          matches: local-value-type-def
                          stopBy: neighbor
                  stopBy:
                    kind: mod_item
              - all:
                  - not:
                      inside:
                        kind: mod_item
                        stopBy: end
                  - inside:
                      kind: source_file
                      all:
                        - has:
                            matches: json-value-use-decl
                            stopBy: neighbor
                        - not:
                            has:
                              matches: local-value-type-def
                              stopBy: neighbor
                      stopBy: end
  json-value-type:
    any:
      - kind: scoped_type_identifier
        regex: "^serde_json::(value::)?Value$"
      - all:
          - kind: type_identifier
            regex: "^Value$"
          - not:
              inside:
                kind: scoped_type_identifier
                stopBy: neighbor
          - matches: in-json-value-scope
rule:
  all:
    - not:
        inside:
          matches: test-scope
          stopBy: end
    - matches: json-value-type
    - not:
        inside:
          kind: generic_type
          all:
            - has:
                field: type
                regex: "^(std::collections::|serde_json::(value::)?|indexmap::|rustc_hash::)?(HashMap|BTreeMap|IndexMap|FxHashMap|Map)$"
            - has:
                field: type_arguments
                kind: type_arguments
                regex: "^<\\s*String\\s*,\\s*(serde_json::(value::)?|serde_yaml::|yaml_serde::|toml::)?Value\\s*>$"
          stopBy:
            any:
              - kind: field_declaration
              - kind: parameter
              - kind: function_item
              - kind: function_signature_item
    - any:
        - inside:
            all:
              - kind: field_declaration
              - not:
                  matches: serde-flatten-field
            stopBy:
              any:
                - kind: field_declaration
                - kind: block
        - inside:
            all:
              - kind: parameter
              - not:
                  inside:
                    kind: closure_parameters
                    stopBy: neighbor
              - not:
                  inside:
                    matches: trait-impl-fn
                    stopBy:
                      kind: function_item
            stopBy:
              any:
                - kind: parameter
                - kind: block
        - inside:
            all:
              - kind: function_item
              - not:
                  matches: trait-impl-fn
            field: return_type
            stopBy:
              any:
                - kind: function_item
                - kind: block
        - inside:
            kind: function_signature_item
            field: return_type
            stopBy:
              kind: function_signature_item
