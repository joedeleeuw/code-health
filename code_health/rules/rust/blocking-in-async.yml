id: blocking-in-async-rust
language: Rust
severity: error
message: Blocking thread::sleep, synchronous std::fs I/O, or synchronous std::process::Command execution inside an async function or block stalls the async runtime executor; use tokio::time::sleep, tokio::fs, tokio::process::Command, or spawn_blocking.
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/target/**"
  - "**/vendor/**"
  - "**/third_party/**"
  - "**/tests/**"
  - "**/examples/**"
  - "**/benches/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
  - "**/*_test.rs"
metadata:
  directive: G7
utils:
  async-scope:
    any:
      - kind: function_item
        has:
          kind: function_modifiers
          regex: "\\basync\\b"
      - kind: async_block
      - kind: closure_expression
        regex: "^async\\b"
  exec-boundary:
    any:
      - kind: function_item
      - kind: async_block
      - kind: closure_expression
  blocking-escape:
    kind: call_expression
    has:
      field: function
      regex: "(spawn_blocking|block_in_place|unblock)$"
  background-task:
    kind: async_block
    inside:
      kind: arguments
      inside:
        kind: call_expression
        has:
          field: function
          regex: "(background_spawn|background_executor\\(\\)\\s*\\.spawn)$"
  async-fs-use:
    kind: use_declaration
    regex: "(tokio|async_std|smol)::(?:fs\\s*;|.*\\bfs\\s*[,}])"
  sync-fs-use:
    kind: use_declaration
    regex: "std::fs(?:\\s*;|\\s*::\\{[^}]*\\bself\\b)"
  async-command-use:
    kind: use_declaration
    regex: "(tokio|async_std|smol)::(?:process::Command\\s*;|.*\\bCommand\\s*[,}])"
  sync-command-use:
    kind: use_declaration
    all:
      - regex: "std::process::(?:Command\\b|.*\\{[^}]*\\bCommand\\b)"
      - not:
          regex: "\\bCommand\\s+as\\s+\\w+"
  sync-sleep-use:
    kind: use_declaration
    all:
      - regex: "std::thread::(?:sleep\\b|\\*|\\{[^}]*\\bsleep\\b)"
      - not:
          regex: "\\bsleep\\s+as\\s+\\w+"
  in-async-fs-scope:
    any:
      - inside:
          kind: block
          has: {matches: async-fs-use, stopBy: neighbor}
          stopBy: {kind: mod_item}
      - inside:
          kind: declaration_list
          all:
            - inside: {kind: mod_item, stopBy: neighbor}
            - has: {matches: async-fs-use, stopBy: neighbor}
          stopBy: {kind: mod_item}
      - all:
          - not: {inside: {kind: mod_item, stopBy: end}}
          - inside:
              kind: source_file
              has: {matches: async-fs-use, stopBy: neighbor}
              stopBy: end
  in-sync-fs-scope:
    any:
      - inside:
          kind: block
          has: {matches: sync-fs-use, stopBy: neighbor}
          stopBy: {kind: mod_item}
      - inside:
          kind: declaration_list
          all:
            - inside: {kind: mod_item, stopBy: neighbor}
            - has: {matches: sync-fs-use, stopBy: neighbor}
          stopBy: {kind: mod_item}
      - all:
          - not: {inside: {kind: mod_item, stopBy: end}}
          - inside:
              kind: source_file
              has: {matches: sync-fs-use, stopBy: neighbor}
              stopBy: end
  in-async-command-scope:
    any:
      - inside:
          kind: block
          has: {matches: async-command-use, stopBy: neighbor}
          stopBy: {kind: mod_item}
      - inside:
          kind: declaration_list
          all:
            - inside: {kind: mod_item, stopBy: neighbor}
            - has: {matches: async-command-use, stopBy: neighbor}
          stopBy: {kind: mod_item}
      - all:
          - not: {inside: {kind: mod_item, stopBy: end}}
          - inside:
              kind: source_file
              has: {matches: async-command-use, stopBy: neighbor}
              stopBy: end
  in-sync-command-scope:
    any:
      - inside:
          kind: block
          has: {matches: sync-command-use, stopBy: neighbor}
          stopBy: {kind: mod_item}
      - inside:
          kind: declaration_list
          all:
            - inside: {kind: mod_item, stopBy: neighbor}
            - has: {matches: sync-command-use, stopBy: neighbor}
          stopBy: {kind: mod_item}
      - all:
          - not: {inside: {kind: mod_item, stopBy: end}}
          - inside:
              kind: source_file
              has: {matches: sync-command-use, stopBy: neighbor}
              stopBy: end
  in-sync-sleep-scope:
    any:
      - inside:
          kind: block
          has: {matches: sync-sleep-use, stopBy: neighbor}
          stopBy: {kind: mod_item}
      - inside:
          kind: declaration_list
          all:
            - inside: {kind: mod_item, stopBy: neighbor}
            - has: {matches: sync-sleep-use, stopBy: neighbor}
          stopBy: {kind: mod_item}
      - all:
          - not: {inside: {kind: mod_item, stopBy: end}}
          - inside:
              kind: source_file
              has: {matches: sync-sleep-use, stopBy: neighbor}
              stopBy: end
  sync-command-call:
    kind: call_expression
    any:
      - has:
          field: function
          kind: scoped_identifier
          regex: "^std::process::Command::new$"
      - all:
          - has:
              field: function
              kind: scoped_identifier
              regex: "^Command::new$"
          - any:
              - matches: in-sync-command-scope
              - not:
                  matches: in-async-command-scope
rule:
  kind: call_expression
  all:
    - not:
        inside:
          matches: test-scope
          stopBy: end
    - not:
        inside:
          kind: await_expression
          stopBy:
            any:
              - kind: arguments
              - kind: expression_statement
              - matches: exec-boundary
    - any:
        - has:
            field: function
            kind: scoped_identifier
            regex: "^(std::)?thread::sleep$"
        - all:
            - has:
                field: function
                kind: identifier
                regex: "^sleep$"
            - matches: in-sync-sleep-scope
        - has:
            field: function
            kind: scoped_identifier
            regex: "^std::fs::(read_to_string|read|write|read_dir|create_dir|create_dir_all|remove_file|remove_dir|remove_dir_all|copy|rename|metadata|symlink_metadata|canonicalize)$"
        - all:
            - has:
                field: function
                kind: scoped_identifier
                regex: "^fs::(read_to_string|read|write|read_dir|create_dir|create_dir_all|remove_file|remove_dir|remove_dir_all|copy|rename|metadata|symlink_metadata|canonicalize)$"
            - any:
                - matches: in-sync-fs-scope
                - not:
                    matches: in-async-fs-scope
        - has:
            field: function
            kind: field_expression
            all:
              - has:
                  field: field
                  regex: "^(output|status|wait|wait_with_output)$"
              - has:
                  field: value
                  kind: call_expression
                  any:
                    - matches: sync-command-call
                    - has:
                        matches: sync-command-call
                        stopBy: end
    - inside:
        matches: async-scope
        stopBy:
          matches: exec-boundary
    - not:
        inside:
          matches: blocking-escape
          stopBy:
            matches: async-scope
    - not:
        inside:
          matches: background-task
          stopBy:
            matches: exec-boundary
