id: reexport-module-rust
language: Rust
severity: error
message: Re-export-only shim module adds an indirection hop without owning behavior; import from the defining module or re-export at the crate boundary (lib.rs / mod.rs).
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/target/**"
  - "**/vendor/**"
  - "**/third_party/**"
  - "**/tests/**"
  - "**/examples/**"
  - "**/benches/**"
  - "**/lib.rs"
  - "**/mod.rs"
  - "**/main.rs"
  - "**/prelude.rs"
  - "**/tests.rs"
  - "**/*_tests.rs"
  - "**/*_test.rs"
rule:
  kind: source_file
  all:
    - not:
        matches: test-scope
    - has:
        kind: use_declaration
        all:
          - has:
              kind: visibility_modifier
          - not:
              matches: test-scope
        stopBy: neighbor
    - not:
        has:
          not:
            any:
              - kind: use_declaration
              - kind: line_comment
              - kind: block_comment
              - kind: attribute_item
              - kind: inner_attribute_item
              - matches: test-scope
          stopBy: neighbor
