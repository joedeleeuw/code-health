id: untyped-value-ingress-rust
language: Rust
severity: error
message: "Boundary payload is decoded into an untyped Value, Table, or Mapping instead of a closed #[derive(Deserialize)] struct or enum; parse once at the boundary into the domain type."
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/target/**"
  - "**/vendor/**"
  - "**/third_party/**"
  - "**/tests/**"
  - "**/examples/**"
  - "**/benches/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
  - "**/*_test.rs"
metadata:
  directive: G4
utils:
  local-untyped-tree-def:
    any:
      - kind: struct_item
        has: {field: name, regex: "^(Value|Table|Mapping)$"}
      - kind: enum_item
        has: {field: name, regex: "^(Value|Table|Mapping)$"}
      - kind: type_item
        has: {field: name, regex: "^(Value|Table|Mapping)$"}
      - kind: union_item
        has: {field: name, regex: "^(Value|Table|Mapping)$"}
  untyped-tree-use-decl:
    kind: use_declaration
    all:
      - regex: "(serde_json|serde_yaml|yaml_serde|toml)::(value::|map::)?(Value\\b|Table\\b|Mapping\\b|\\*|\\{[^}]*\\b(Value|Table|Mapping)\\b)"
      - not:
          regex: "\\b(Value|Table|Mapping)\\s+as\\s+\\w+"
  in-untyped-tree-scope:
    any:
      - inside:
          kind: block
          all:
            - has:
                matches: untyped-tree-use-decl
                stopBy: neighbor
            - not:
                has:
                  matches: local-untyped-tree-def
                  stopBy: neighbor
          stopBy:
            kind: mod_item
      - all:
          - not:
              inside:
                kind: block
                has:
                  matches: local-untyped-tree-def
                  stopBy: neighbor
                stopBy:
                  kind: mod_item
          - any:
              - inside:
                  kind: declaration_list
                  all:
                    - inside:
                        kind: mod_item
                        stopBy: neighbor
                    - has:
                        matches: untyped-tree-use-decl
                        stopBy: neighbor
                    - not:
                        has:
                          matches: local-untyped-tree-def
                          stopBy: neighbor
                  stopBy:
                    kind: mod_item
              - all:
                  - not:
                      inside:
                        kind: mod_item
                        stopBy: end
                  - inside:
                      kind: source_file
                      all:
                        - has:
                            matches: untyped-tree-use-decl
                            stopBy: neighbor
                        - not:
                            has:
                              matches: local-untyped-tree-def
                              stopBy: neighbor
                      stopBy: end
rule:
  all:
    - not:
        inside:
          matches: test-scope
          stopBy: end
    - any:
        - kind: call_expression
          all:
            - has:
                field: function
                kind: generic_function
                all:
                  - has:
                      field: function
                      regex: "((serde_json|serde_yaml|yaml_serde|toml)::(from_str|from_slice|from_reader)|\\.json)$"
                  - has:
                      field: type_arguments
                      any:
                        - regex: "^<\\s*(serde_json::(value::)?|serde_yaml::|yaml_serde::|toml::)(Value|Table|Mapping)\\s*>$"
                        - all:
                            - regex: "^<\\s*(Value|Table|Mapping)\\s*>$"
                            - matches: in-untyped-tree-scope
            - not:
                has:
                  field: arguments
                  has:
                    kind: call_expression
                    has:
                      field: function
                      regex: "^(serde_json::)?to_string"
                    stopBy: end
        - kind: let_declaration
          all:
            - has:
                field: type
                any:
                  - regex: "^(serde_json::(value::)?|serde_yaml::|yaml_serde::|toml::)(Value|Table|Mapping)$"
                  - all:
                      - regex: "^(Value|Table|Mapping)$"
                      - matches: in-untyped-tree-scope
            - has:
                field: value
                has:
                  kind: call_expression
                  has:
                    field: function
                    regex: "((serde_json|serde_yaml|yaml_serde|toml)::(from_str|from_slice|from_reader)|\\.json)$"
                  stopBy:
                    kind: block
            - not:
                has:
                  field: value
                  has:
                    kind: call_expression
                    has:
                      field: function
                      regex: "^(serde_json::)?to_string"
                    stopBy:
                      kind: block
