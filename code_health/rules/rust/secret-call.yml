id: secret-call-rust
language: Rust
severity: error
message: Direct secret-store call (secret-tool, op, security). Read secrets through the repository's one resolver, not at each call site.
ignores:
  - "**/vendor/**"
  - "**/third_party/**"
metadata:
  directive: G18
rule:
  kind: call_expression
  regex: "(secret-tool|\"op\"[\\s\\S]*\"(read|item)\"|find-generic-password)"
