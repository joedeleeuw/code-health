id: untyped-json-response-rust
language: Rust
severity: error
message: Ok(json!({ ... })) returns an ad-hoc untyped JSON object instead of a closed #[derive(Serialize)] struct or enum.
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/target/**"
  - "**/vendor/**"
  - "**/third_party/**"
  - "**/tests/**"
  - "**/examples/**"
  - "**/benches/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
  - "**/*_test.rs"
metadata:
  directive: G4
rule:
  kind: call_expression
  all:
    - not:
        inside:
          matches: test-scope
          stopBy: end
    - not:
        inside:
          matches: trait-impl-fn
          stopBy:
            kind: function_item
    - has:
        field: function
        kind: identifier
        regex: "^Ok$"
    - has:
        field: arguments
        has:
          kind: macro_invocation
          all:
            - has:
                field: macro
                regex: "^(serde_json::)?json$"
            - has:
                kind: token_tree
                regex: "^\\(\\s*\\{"
          stopBy: neighbor
