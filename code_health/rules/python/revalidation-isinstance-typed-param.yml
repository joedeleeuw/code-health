id: revalidation-isinstance-typed-param
language: Python
severity: error
message: Function re-checks isinstance() on a parameter whose signature already guarantees that concrete type. Decode untrusted input once at the boundary (typed as object/raw) and trust internal types.
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/site-packages/**"
  - "**/vendor/**"
  - "**/third_party/**"
  - "**/tests/**"
  - "**/test/**"
  - "**/testing/**"
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/conftest.py"
utils:
  concrete-typed-param:
    inside:
      kind: function_definition
      stopBy: end
      not:
        any:
          - has:
              field: name
              regex: "^__(?:eq|ne|lt|le|gt|ge|add|radd|sub|rsub|mul|rmul|truediv|or|ror|and|rand)__$"
          - has: {kind: decorator}
      has:
        field: parameters
        has:
          any:
            - kind: typed_parameter
              all:
                - has: {kind: identifier, pattern: $X}
                - has: {field: type, has: {kind: identifier, pattern: $T}, regex: "^[A-Za-z_][A-Za-z0-9_]*$"}
            - kind: typed_default_parameter
              all:
                - has: {field: name, pattern: $X}
                - has: {field: type, has: {kind: identifier, pattern: $T}, regex: "^[A-Za-z_][A-Za-z0-9_]*$"}
                - not: {has: {field: value, regex: "^None$"}}
rule:
  all:
    - pattern: isinstance($X, $T)
    - matches: concrete-typed-param
constraints:
  T:
    not:
      regex: "^(?:Any|object|Sequence|Mapping|MutableMapping|Iterable|Iterator|Collection|Callable)$"
