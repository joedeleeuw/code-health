id: sum-to-product-class-python
language: Python
severity: error
message: Class flattens mutually exclusive success/failure outcomes into a boolean ok/success flag plus an optional error field; model distinct outcomes as a union of closed types or raise an exception.
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/site-packages/**"
  - "**/vendor/**"
  - "**/Vendor/**"
  - "**/third_party/**"
  - "**/tests/**"
  - "**/test/**"
  - "**/testing/**"
  - "**/examples/**"
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/conftest.py"
utils:
  outermost-optional-annotation:
    any:
      - kind: binary_operator
        has:
          kind: none
          stopBy:
            not:
              kind: binary_operator
      - kind: generic_type
        has:
          kind: identifier
          regex: "^Optional$"
          stopBy: neighbor
      - kind: generic_type
        all:
          - has:
              kind: identifier
              regex: "^Union$"
              stopBy: neighbor
          - has:
              kind: type_parameter
              has:
                kind: type
                has:
                  kind: none
                  stopBy: neighbor
                stopBy: neighbor
              stopBy: neighbor
      - kind: subscript
        has:
          field: value
          regex: "^(typing|typing_extensions)\\.Optional$"
      - kind: subscript
        all:
          - has:
              field: value
              regex: "^(typing|typing_extensions)\\.Union$"
          - has:
              field: subscript
              kind: none
rule:
  kind: class_definition
  has:
    field: body
    kind: block
    all:
      - has:
          kind: expression_statement
          has:
            kind: assignment
            all:
              - has:
                  field: left
                  kind: identifier
                  regex: "^(ok|is_ok|success|succeeded|is_error|failed)$"
              - has:
                  field: type
                  regex: "^bool$"
          stopBy: neighbor
      - has:
          kind: expression_statement
          has:
            kind: assignment
            all:
              - has:
                  field: left
                  kind: identifier
                  regex: "^(error|err|error_message|err_msg|failure_reason)$"
              - has:
                  field: type
                  kind: type
                  has:
                    matches: outermost-optional-annotation
                    stopBy: neighbor
          stopBy: neighbor
