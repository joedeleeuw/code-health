id: test-imports-private
language: Python
severity: error
message: A test imports a private product name. Test through the module's public entry points, or make the name part of the interface.
files:
  - "**/tests/**"
  - "**/test/**"
  - "**/testing/**"
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/conftest.py"
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/site-packages/**"
metadata:
  directive: D1
utils:
  product-import:
    kind: import_from_statement
    has:
      field: module_name
      not:
        any:
          - kind: relative_import
          - regex: "(?:^|\\.)(?:tests?|testing|conftest|test_\\w+)(?:\\.|$)"
rule:
  kind: dotted_name
  regex: "^_[A-Za-z0-9]"
  any:
    - all:
        - inside: {matches: product-import}
        - not: {inside: {matches: product-import, field: module_name}}
    - inside:
        kind: aliased_import
        field: name
        inside: {matches: product-import}
