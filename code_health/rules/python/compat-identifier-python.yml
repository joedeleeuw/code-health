id: compat-identifier-python
language: Python
severity: error
message: Compatibility/retirement name declared. No backwards compatibility and no codified removals; delete the old path instead.
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/fixtures/**"
  - "**/__fixtures__/**"
  - "**/tests/**"
  - "**/test/**"
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
metadata:
  directive: G5
rule:
  kind: identifier
  all:
    - any:
        - regex: "(?i)(legacy|deprecat|retire|no_?longer)"
        - all:
            - regex: "(?i)compat"
            - not: {regex: "(?i)compatib"}
    - any:
        - inside: {kind: function_definition, field: name}
        - inside: {kind: class_definition, field: name}
        - inside: {kind: assignment, field: left}
        - inside: {kind: parameters}
        - inside: {kind: default_parameter, field: name}
        - inside: {kind: typed_parameter}
        - inside: {kind: typed_default_parameter, field: name}
