id: error-string-branch-python
language: Python
severity: error
message: Exception handler branches on substrings of str(err) instead of catching a specific exception type or checking a structured status or error-code attribute.
ignores:
  - "**/gen/**"
  - "**/generated/**"
  - "**/site-packages/**"
  - "**/vendor/**"
  - "**/Vendor/**"
  - "**/third_party/**"
  - "**/tests/**"
  - "**/test/**"
  - "**/testing/**"
  - "**/examples/**"
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/conftest.py"
rule:
  kind: except_clause
  all:
    - has:
        kind: as_pattern
        has:
          kind: as_pattern_target
          has:
            kind: identifier
            pattern: $E
    - has:
        kind: if_statement
        has:
          field: condition
          any:
            - pattern: $SUB in str($E)
            - pattern: $SUB not in str($E)
            - pattern: $SUB in str($E).lower()
            - pattern: $SUB not in str($E).lower()
            - pattern: str($E).startswith($$$)
            - pattern: str($E).endswith($$$)
            - pattern: str($E).lower().startswith($$$)
            - pattern: str($E).lower().endswith($$$)
            - has:
                any:
                  - pattern: $SUB in str($E)
                  - pattern: $SUB not in str($E)
                  - pattern: $SUB in str($E).lower()
                  - pattern: $SUB not in str($E).lower()
                  - pattern: str($E).startswith($$$)
                  - pattern: str($E).endswith($$$)
                  - pattern: str($E).lower().startswith($$$)
                  - pattern: str($E).lower().endswith($$$)
                stopBy:
                  any:
                    - kind: block
                    - kind: lambda
        stopBy:
          any:
            - kind: function_definition
            - kind: class_definition
            - kind: except_clause
