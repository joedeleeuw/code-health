id: secret-call-bash
language: Bash
severity: error
message: Direct secret-store call (secret-tool, op, security). Read secrets through the repository's one resolver, not at each call site.
ignores:
  - "scripts/secret-resolve"
  - "scripts/secret-provision"
  - "scripts/secret-get"
metadata:
  directive: G18
rule:
  kind: command
  regex: "^(secret-tool|op (read|item get)|security find-generic-password[\\s\\S]*\\s-(w|g)\\b)"
