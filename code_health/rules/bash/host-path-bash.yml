id: host-path-bash
language: Bash
severity: error
message: Host-absolute path in a repository file (tracked or untracked; only ignored files are skipped). Use HOME-relative or config-driven paths.
ignores:
  - "**/fixtures/**"
  - "**/__fixtures__/**"
metadata:
  directive: S4
rule:
  kind: string
  has:
    kind: string_content
    regex: "^/(Users|home)/[^/]+/"
