[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-health"
version = "0.1.0"
description = "Whole-workspace static analysis and ratchet for Python, Rust, and Nix"
requires-python = ">=3.12"
dependencies = [
    "Jinja2==3.1.6",
    "PyYAML==6.0.3",
    "packaging==25.0",
    "pydantic==2.12.3",
    "tree-sitter==0.25.2",
    "tree-sitter-rust==0.24.2",
]

[project.scripts]
code-health = "code_health.cli:main"
