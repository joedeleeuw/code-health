[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-health"
version = "0.1.0"
description = "Whole-workspace static analysis for Python and Nix, with a Rust preset"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "Jinja2==3.1.6",
    "PyYAML==6.0.3",
    "packaging==25.0",
    "pydantic==2.12.3",
]

[project.scripts]
code-health = "code_health.cli:main"

[tool.code-health]
exclude = ["code_health/config/rule-tests/*"]
